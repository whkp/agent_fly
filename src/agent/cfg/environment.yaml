# ============================================================================
# Agent UAV Environment Configuration (CERLAB autonomous_flight)
# ============================================================================
# 
# 此环境配置文件用于创建支持GPU加速的无人机Agent系统
# 使用 CERLAB autonomous_flight 导航系统
# 
# GPU支持:
#   - NVIDIA GPU with CUDA 12.1+ 
#   - 已测试硬件: NVIDIA GeForce RTX 3060 Ti
# 
# 安装说明:
#   1. 创建环境: conda env create -f environment.yaml
#   2. 激活环境: conda activate agent_uav
#   3. 验证GPU: python -c "import torch; print(torch.cuda.is_available())"
# 
# ============================================================================

name: agent_uav
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python版本
  - python=3.10

  # 计算机视觉
  - opencv>=4.5.0
  - pillow>=8.0.0

  # 科学计算
  - numpy>=1.22.0
  - scipy>=1.10.0

  # 其他工具
  - pyyaml>=5.4.0
  - matplotlib>=3.3.0

  - pip

  - pip:
      # ============================================
      # 深度学习框架 - GPU加速版本 (CUDA 12.1)
      # ============================================
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - torchaudio==2.5.1+cu121
      
      # ============================================
      # YOLO检测
      # ============================================
      - ultralytics>=8.3.0
      
      # ============================================
      # LLM Agent
      # ============================================
      - openai>=1.0.0
      - langchain==0.2.16
      - langchain-community==0.2.16
      - langchain-openai==0.1.23
      - langchain-core==0.2.38
      
      # Transformers
      - transformers>=4.30.0
      - huggingface-hub>=0.16.0
      
      # ============================================
      # ROS相关
      # ============================================
      - rospkg
      - catkin_pkg
      - empy
      
      # ============================================
      # 其他依赖
      # ============================================
      - requests>=2.25.0
      - tqdm>=4.65.0
      - colorama>=0.4.6
